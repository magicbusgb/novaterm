name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows/amd64
            artifact: NovaTerm-windows-amd64.exe
            file: build/bin/NovaTerm.exe
          - os: macos-latest
            platform: darwin/universal
            artifact: NovaTerm-macos.zip
            file: build/bin/NovaTerm.app
          - os: ubuntu-22.04
            platform: linux/amd64
            artifact: NovaTerm-linux-amd64
            file: build/bin/NovaTerm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Dipendenze Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Installa Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Build
        run: wails build -platform ${{ matrix.platform }} -skipbindings -trimpath -ldflags "-s -w"
      - name: Prepara artefatto
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "macOS" ]; then
            (cd build/bin && zip -qry ../../out/${{ matrix.artifact }} NovaTerm.app)
          else
            cp "${{ matrix.file }}" "out/${{ matrix.artifact }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}
      - name: Allega alla release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/${{ matrix.artifact }}
